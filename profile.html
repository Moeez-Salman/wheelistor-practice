<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheelister - Profile</title>
    <link rel="icon" href="logo-removebg-preview.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #0066FF;
            --primary-dark: #0052cc;
            --secondary: #00D5FF;
            --dark: #051323;
            --darker: #051a31;
            --light: #f8f9fa;
            --gray: #6c757d;
        }

        body {
            background-color: var(--dark);
            color: white;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
        }

        .logo-container {
            height: 50px;
            width: 180px;
            position: relative;
        }

        .logo-container img {
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
        }

        .navbar {
            background-color: rgba(5, 26, 49, 0.8) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 0;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            transition: all 0.3s;
            margin: 0 0.2rem;
        }

        .nav-link:hover {
            color: white;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .nav-link.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.3);
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin: 2rem 0;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 3rem;
            margin-top: 2rem;
            backdrop-filter: blur(5px);
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 102, 255, 0.1), transparent 70%);
            z-index: -1;
        }

        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 2rem;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 60px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 2rem;
            box-shadow: 0 10px 20px rgba(0, 102, 255, 0.3);
        }

        .profile-avatar i {
            font-size: 3rem;
            color: white;
        }

        .profile-username {
            font-size: 2rem;
            font-weight: 600;
            margin: 0;
        }

        .profile-role {
            color: var(--secondary);
            font-size: 1rem;
            margin-top: 0.5rem;
        }

        .profile-info-item {
            padding: 1.2rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
        }

        .profile-info-item:last-child {
            border-bottom: none;
        }

        .info-icon {
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1.5rem;
        }

        .info-icon i {
            color: var(--secondary);
            font-size: 1.2rem;
        }

        .info-label {
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            width: 100px;
        }

        .info-value {
            font-weight: 600;
            color: white;
            flex-grow: 1;
        }

        .profile-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 2rem;
            gap: 1rem;
        }

        .action-button {
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .btn-edit {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
        }

        .btn-edit:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-logout {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.3);
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 102, 255, 0.4);
        }

        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--secondary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(255, 59, 48, 0.1);
            border-left: 4px solid rgba(255, 59, 48);
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        @media (max-width: 768px) {
            .profile-card {
                padding: 1.5rem;
            }
            
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
            
            .profile-avatar {
                margin-right: 0;
                margin-bottom: 1.5rem;
            }
            
            .profile-info-item {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .info-icon {
                margin-right: 0;
                margin-bottom: 0.5rem;
            }
            
            .info-label {
                width: 100%;
                margin-bottom: 0.5rem;
            }
        }
    </style>
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand logo-container" href="#">
                <img src="logo-removebg-preview.png" alt="Wheelister Logo">
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="gotodashboard()">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="gotobookings()">My Bookings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="gotome()">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Settings</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container" style="margin-top: 100px;">
        <h1 class="page-title">Your Profile</h1>
        
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                <div class="profile-card">
                    <div id="userInfo">
                        <div class="loading-spinner">
                            <div class="spinner"></div>
                            <p>Loading your profile information...</p>
                        </div>
                    </div>
                    
                    <div class="profile-actions">
                        <button class="action-button btn-edit">
                            <i class="fas fa-pen"></i>
                            Edit Profile
                        </button>
                        <button class="action-button btn-logout">
                            <i class="fas fa-sign-out-alt"></i>
                            Log Out
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <script>
        function gotodashboard() {
            window.location.href = "UserDashboard.html";
        }

        function gotobookings() {
            window.location.href = "bookings.html";
        }

        function gotome() {
            window.location.href = "about.html";
        }

        // Get username from local storage
        const username = localStorage.getItem("username");

        // Format placeholders for display
        function formatProfileData(user) {
            return `
                <div class="profile-header">
                    <div class="profile-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div>
                        <h2 class="profile-username">${user.username}</h2>
                        <p class="profile-role">Premium Member</p>
                    </div>
                </div>
                
                <div class="profile-info">
                    <div class="profile-info-item">
                        <div class="info-icon">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <span class="info-label">Email</span>
                        <span class="info-value">${user.email}</span>
                    </div>
                    
                    <div class="profile-info-item">
                        <div class="info-icon">
                            <i class="fas fa-phone"></i>
                        </div>
                        <span class="info-label">Phone</span>
                        <span class="info-value">${user.phone}</span>
                    </div>
                    
                    <div class="profile-info-item">
                        <div class="info-icon">
                            <i class="fas fa-map-marker-alt"></i>
                        </div>
                        <span class="info-label">Location</span>
                        <span class="info-value">${user.location}</span>
                    </div>
                    
                    <div class="profile-info-item">
                        <div class="info-icon">
                            <i class="fas fa-calendar-check"></i>
                        </div>
                        <span class="info-label">Member Since</span>
                        <span class="info-value">March 2025</span>
                    </div>
                </div>
            `;
        }

        function showError(message) {
            return `
                <div class="error-message">
                    <p><i class="fas fa-exclamation-circle"></i> ${message}</p>
                </div>
            `;
        }

        // Check if username exists
        if (!username) {
            document.getElementById("userInfo").innerHTML = showError("Username not found. Please log in again.");
        } else {
            // Fetch user data
            fetch("http://localhost:3000/getuser", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.data.length > 0) {
                    const user = data.data[0];
                    document.getElementById("userInfo").innerHTML = formatProfileData(user);
                } else {
                    document.getElementById("userInfo").innerHTML = showError("User not found. Please log in again.");
                }
            })
            .catch(error => {
                console.error("Fetch error:", error);
                document.getElementById("userInfo").innerHTML = showError("Error loading profile data. Please try again later.");
            });
        }
    </script>
</body>
</html>
