<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheelister</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="additionalinfo.css">
</head>

<body style="background-color: #051323;">
    
    <div class="full-width-header">
        <div class="container">
          <header class="d-flex flex-wrap justify-content-center py-3 mb-5" style="position: relative; z-index: 2;">
            <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
              <svg class="bi me-2" width="40" height="32"><use xlink:href="#bootstrap"></use></svg>
              <a href=""><img src="logo-removebg-preview.png" alt="" style="position: absolute;left: -1400px;top:0px"></a>
            </a>
      
            <ul class="nav nav-pills">
              <li class="nav-item"><a href="#" class="nav-link" onclick="gotodashboard()" aria-current="page">Home</a></li>
              <li class="nav-item"><a href="#" class="nav-link active" onclick="gotobookings()">My Bookings</a></li>
              <li class="nav-item"><a href="#" class="nav-link" onclick="gotoprofile()">Profile</a></li>
              <li class="nav-item"><a href="#" class="nav-link" onclick="gotome()">About</a></li>
              <li class="nav-item"><a href="#" class="nav-link">Settings</a></li>
            </ul>
          </header>
        </div>
      </div>

      <!-- Fixing the hr issue with z-index and better positioning -->
      <hr style="position: absolute; top: 100px; left: 0; right: 0; border-top: 1px solid aliceblue; z-index: 1;">

      <p style="position: absolute;top: 190px;color: aliceblue;left: 780px;font-size: 50px;">
        Your Bookings
      </p>

  <div class="d-grid gap-3" style="grid-template-columns: 1fr 2fr;">
    <div class="bg-body-tertiary border rounded-3" style="position: absolute; left: 25%; width: 1000px; top: 380px; padding: 40px;">
      <div id="userInfo" class="text-dark fs-5 fw-medium">
        <p>Loading...</p> <!-- Display loading text initially -->
      </div>
    </div>
  </div>




  <script>
    
  function gotoprofile() {
      setTimeout(() => {
        window.location.href = "profile.html";
      }, 1000);
    }

    
  function gotodashboard() {
      setTimeout(() => {
        window.location.href = "UserDashboard.html";
      }, 1000);
    }

    
  function gotobookings() {
      setTimeout(() => {
        window.location.href = "bookings.html";
      }, 1000);
    }

    function gotome() {
      setTimeout(() => {
        window.location.href = "about.html";
      }, 1000);
    }

  </script>
</body>
</html>
